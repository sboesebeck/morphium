# Integration-test application config.
# Uses Morphium's InMemDriver – no MongoDB process or Docker required.
quarkus.morphium.database=it-db
quarkus.morphium.driver-name=InMemDriver

# Suppress Dev Services (InMemDriver is used instead)
quarkus.morphium.devservices.enabled=false

# A named instance (MOR-032): its own database, injected with @MorphiumInstance("second")
quarkus.morphium.named."second".database=it-second-db
quarkus.morphium.named."second".driver-name=InMemDriver
