  description: 'Seen on 2026-10-20 while verifying MOR-072. The Quarkus integration tests MorphiumMigrationTest.inFlightHeartbeatAdvancesExpiryDuringSingleUnit and renewLockBetweenChangeUnitsAdvancesExpiry (timing based, 300 to 900 ms windows; the log says the collection still exists 10 s after dropCollection, so the test runs slowly) and the core test MultithreaddedMessagingTests (NullPointerException: Morphium.getDriver() is null in worker threads after close) failed, also on a checkout without the MOR-072 change (stashed). All three passed in earlier runs of the same stack (MOR-073, MOR-034). One earlier run of MorphiumMigrationTest failed in the full suite and passed alone. Find out whether the machine (about 25 leftover testcontainers, OrbStack just restarted) or a real race is the cause, and make the timing tests robust.'
