- id: MOR-029
  title: 'InMemoryDriver: reject values BsonEncoder cannot encode'
  type: defect
  status: done
  priority: 2
  effort: M
  description: 'The InMemoryDriver stores POJOs in $set as live Java objects (List, array, Map, Map-in-Map) and,
    for a Set or a single POJO, stores them and then fails with a ClassCastException wrapped in RuntimeException,
    leaving a half-written document. A real MongoDB fails with ''Unhandled Data type'' up front. Make the InMemoryDriver
    fail the same way before changing anything. Related to GitHub #336 (unmapped values stored verbatim); link it.
    After MOR-002 only hand-built commands reach the encoder or the InMemoryDriver with POJOs.'
  acceptance:
  - Update with a POJO inside $set fails identically in type and message prefix on both drivers and leaves the document
    unchanged
  - Reproduction assertions for hypothesis 4 are flipped
  source:
  - docs/research/reproduction-results.md hypothesis 4
  - 'GitHub #336'
  evidence: 'UnencodableValuesTest (6 tests, 12 invocations) on mongo:8 and the InMemoryDriver: an update command with a POJO in the six shapes (single value, List, Set, array, Map, Map in Map), a push, addToSet and setOnInsert operand, a findAndModify, an insert and a store fail with a MorphiumDriverException Error sending Request: caused by the RuntimeException Unhandled Data type: and the document is unchanged; the values the encoder takes (Set of strings, LocalDate, Date, UUID, Pattern, byte array, nested lists) are accepted on both drivers. Before the change the five refusal tests failed on the InMemoryDriver only. BsonEncoderRequireEncodableTest (6 tests) checks that requireEncodable agrees with encodeDocument, including the message. The reproduction note for hypothesis 4 is updated. Regression: 1508 test methods (core and messaging) on the InMemoryDriver, all passed. Not covered: Map keys that are not strings, and the update-with-pipeline form of u, which the check walks as a list of documents but no test covers.'
  commits:
  - b3d7d9340
- id: MOR-030
  title: 'InMemoryDriver: honour the filter in conditional upsert and raise E11000'
  type: defect
  status: done
  priority: 1
  effort: M
  description: 'On an existing document whose conditional filter does not match, MongoDB throws E11000 (held lease).
    The InMemoryDriver silently overwrites the document, so contender B steals the lease of A; with a compound filter
    it also inserts a new document per call (see MOR-003). Fix the upsert semantics and the error. Related to GitHub
    #399 (InMemoryDriver update documents); link it.'
  acceptance:
  - 'Held-lease scenario: second contender gets the E11000 MorphiumDriverException on both drivers'
  - ConditionalUpsertReproductionTest conditionalUpsertOnHeldLease asserts the same outcome for both drivers
  source:
  - docs/research/reproduction-results.md hypothesis 5
  - 'GitHub #399'
  evidence: 'InMemUpsertDuplicateKeyTest 9 tests (findAndModify path, update command path, id pinned by $setOnInsert,
    matching filter, filter without id, store() still replaces, 8 racing threads with exactly one winner); the pins
    that documented the overwrite were flipped to the duplicate key expectation (ConditionalUpsertReproductionTest,
    FindOneAndUpdateCompoundFilterUpsertTest, UpdateKeyTranslationTest) and now hold for PooledDriver (mongo:8)
    and InMemoryDriver alike. Before the fix 11 of these tests failed on the InMemoryDriver only. Regression: inmem
    package suite and the writer/mapper/messaging subset, 778 tests, 0 failures, 2 ReferenceCascadeTest errors (Byte
    Buddy does not support Java 25, the JDK of the run; unrelated). Remaining divergence: the update command path
    throws on the InMemoryDriver while a real MongoDB returns writeErrors code 11000 (MOR-005).'
  commits:
  - e2a1167a8
