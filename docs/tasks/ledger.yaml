- id: MOR-017
  title: 'Jakarta Data: JDQL DELETE FROM'
  type: implementation
  status: open
  priority: 2
  effort: M
  description: DELETE FROM is part of Jakarta Data 1.0 (not 1.1). JdqlParser only accepts SELECT/WHERE/GROUP BY/HAVING/ORDER
    BY. Add DELETE FROM [WHERE] returning void/int/long (matched count) in JdqlParser, the Spring proxy path and
    MorphiumDataProcessor. Query.delete() already returns n. State whether lifecycle callbacks run (derived deleteBy
    skips them).
  acceptance:
  - A @Query("DELETE FROM Entity WHERE ...") method works in the Quarkus and the Spring module against a real MongoDB
  - Return types void, int and long are supported; other types are rejected at build time
  - Verified against a real MongoDB (not only the InMemoryDriver).
  source:
  - docs/research/jakarta-data-1.1.md section 1
- id: MOR-018
  title: 'Jakarta Data: JDQL UPDATE ... SET ... WHERE as one atomic update'
  type: implementation
  status: open
  priority: 2
  effort: L
  description: 'UPDATE is part of 1.0. SET items are field = expression or NULL; no increment operator, an increment
    is x = x + ?1. Map to one atomic command: assignment to $set, NULL to $unset, x = x + :n to $inc, x = x * :n
    to $mul, built through the builder so names and values are mapped. Return the matched count (n, not nModified).
    Arithmetic on other fields, ''||'' and string functions need pipeline updates (FindAndModifyMongoCommand has
    a pipeline field that Query does not expose): reject them at build time with a clear message, or handle in a
    follow-up. JNoSQL rejects arithmetic entirely, so this goes beyond it.'
  acceptance:
  - A method with SET a = :x, n = n + 1 WHERE id = :id issues exactly one update command on a real MongoDB
  - Return value equals the matched count
  - Unsupported expressions fail at build time
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-006
  - MOR-007
  source:
  - docs/research/jakarta-data-1.1.md sections 1, 4
  - docs/research/other-clients.md pattern 12
- id: MOR-019
  title: 'Jakarta Data: reject unsupported @Find/@Delete parameter styles at build time'
  type: defect
  status: open
  priority: 2
  effort: S
  description: FindMethodBridge and MorphiumDataProcessor turn every @Find/@Delete parameter into an equality. With
    Jakarta Data 1.1 an @Is(AtLeast.class) parameter would silently run as eq and a Restriction parameter would
    be treated as an attribute. Reject @Is, Constraint, Restriction and @First usage with a clear build error until
    MOR-020 supports them.
  acceptance:
  - A repository with an @Is or Restriction parameter fails the Quarkus build with a message naming the method (processor
    test)
  - The Spring proxy path throws at startup with the same message
  source:
  - docs/research/jakarta-data-1.1.md section 4
- id: MOR-020
  title: 'Jakarta Data 1.1: @Is, constraints, @First and attribute-only Restriction'
  type: implementation
  status: open
  priority: 3
  effort: L
  description: 'Adopt the 1.1 query features once 1.1 is final (latest is 1.1.0-M4, no final date known). @Is, jakarta.data.constraint.*,
    @First and attribute-only Restriction need no new core API (operators exist in QueryExecutor); arithmetic/function
    restrictions need $expr. Bump jakarta.data.version, keep 1.0 compatibility decisions explicit. Do not duplicate
    GitHub #302 (lifecycle CDI events); link it.'
  acceptance:
  - Methods using @Is with each constraint type and a Restriction parameter return correct results on a real MongoDB
  - '@First(n) limits results; combining it with Limit/PageRequest is rejected'
  - The dependency is bumped and the module builds against it
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-019
  - MOR-023
  source:
  - docs/research/jakarta-data-1.1.md
  - 'GitHub #302'
- id: MOR-021
  title: 'Morphium extension: atomic update and find-and-modify repository annotations'
  type: implementation
  status: open
  priority: 2
