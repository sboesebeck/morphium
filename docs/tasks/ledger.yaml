- id: MOR-009
  title: 'Lifecycle handling in the builder: @LastChange, @CreationTime, @Version'
  type: implementation
  status: open
  priority: 2
  effort: M
  description: 'findOneAndUpdate skips pre/post update events, @LastChange, @CreationTime and @Version. Decide and
    implement which automatic values the builder applies (@LastChange via $set, @CreationTime via $setOnInsert,
    @Version via $inc unless the update touches it). This also removes the @Version trap: a $setOnInsert without
    version leaves 0 and a later store() fails with E11000 (confirmed on both drivers; Spring inc-version pattern,
    to be proven on a real MongoDB). State the event contract (no @PreStore/@PostStore) in the Javadoc and in MOR-027.'
  acceptance:
  - An upsert through the builder on an @Version entity followed by store() of the loaded entity succeeds on a real
    MongoDB
  - '@LastChange and @CreationTime values are set by the builder when the entity declares them, shown by tests'
  - ConditionalUpsertReproductionTest version-trap assertions are flipped
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-006
  source:
  - docs/research/reproduction-results.md hypothesis 5
  - docs/research/other-clients.md patterns 7, 8
- id: MOR-010
  title: Typed duplicate-key exception and typed result for a lost conditional upsert
  type: implementation
  status: open
  priority: 2
  effort: M
  description: 'A conditional upsert on an existing but non-matching document throws MorphiumDriverException with
    mongoCode 11000 (Integer, writeErrors null); a store() duplicate reports the code inside writeErrors with mongoCode
