    old signature as a delegating overload. Document and define the result for an upsert that inserts with returnDocument
    BEFORE (null today, reproduced on both drivers). The arrayFilters wiring of FindAndModifyMongoCommand and InMemoryDriver.findAndOneAndUpdate
    is done by MOR-006; this task keeps the options object, projection and hint, which the InMemoryDriver currently
    drops in findAndModify (InMemoryDriver.java around line 4129).
