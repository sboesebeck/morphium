- id: MOR-059
  title: 'Query, entity and bulk write paths swallow the writeErrors of the update reply'
  type: defect
  status: done
  priority: 1
  effort: M
  description: 'Found by the write path audit (MOR-005), measured on mongo:8. The update command reports a rejected
    statement (duplicate key, a path below a scalar, a pull on a non-array) in the reply and does not throw. Every
    path through MorphiumWriterImpl and the bulk context ignores that reply and returns normally: Query.set, set(Map),
    setEnum, unset, inc and dec (all number types, enum variants), push, pushAll, pull, pullAll, Morphium.addToSet,
    currentDate, inc/dec with a Map, setInEntity, unsetInEntity, push(entity) and the bulk requests. The caller sees
    success while nothing was written. Only Morphium.inc(entity) and dec(entity) raise. Related to GitHub #408
    (writeConcernError ignored). Query.updateMapped (MOR-050) already normalises the reply and is the model: a
    writeErrors entry becomes a MorphiumDriverException with the code of the first error, isDuplicateKey() works.'
