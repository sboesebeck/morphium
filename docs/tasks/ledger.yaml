  description: 'Found with MOR-097. CollectionIndexStore stores an array as ONE index key (IndexKey: per-element multikey indexing is a Phase B follow-up, #289), so a unique index on an array field only rejects a second document with the SAME array. mongod enforces it per element: $push, $addToSet, $push with $each, an insert and a store of a value that another document already holds are a duplicate key (11000). WritePathAuditContractTest.aRejectedWriteIsRaised against PoppyDB: Query.push(field), Query.push(enum), Query.pushAll(field), Morphium.addToSet, Morphium.push(entity) and Bulk.addPushRequest do not raise. Needs a design decision: per-element index keys in the store (also gives the planner multikey lookups) or a unique-only check for array fields.'
  acceptance:
  - 'A unique index on an array field rejects a value, in an insert, a store and an update ($push, $addToSet, $each), that another document holds, with 11000 and no change'
  - 'The six push cases of WritePathAuditContractTest pass against PoppyDB'
  source:
  - morphium-core/src/main/java/de/caluga/morphium/driver/inmem/IndexKey.java
  - morphium-core/src/main/java/de/caluga/morphium/driver/inmem/CollectionIndexStore.java
  evidence: 'MultikeyUniqueIndexTest (12 tests, InMemoryDriver): $push, $push with $each and $addToSet of a value that another document holds raise 11000 and change nothing, a free value works and is then held, a pulled element and a deleted document free their elements, an insert with a held element and an insert of a scalar that an array holds raise 11000, the same value twice in one document is allowed, a store build over overlapping arrays is rejected and registers nothing, an array of sub documents (items.sku) is unique per element for insert and update; 7 of the first 11 failed before the change; the 12th (a rejected first array leaves no phantom elements behind) was written for a defect found in review, the element buckets were built from the changed document of an update that is rolled back (the sub document test passed for the wrong reason, both documents were MISSING; it now also inserts a free sku). Implementation: IndexKey.elementKeys (element keys incl. dotted paths through arrays and the product for a compound index) and an element bucket map per unique index other than _id_, built when the first array turns up. UniqueIndexTest, CollectionIndexStoreTest, IndexKeyTest, UpdateRejectionTest pass. Regression, tags core and inmemory on the InMemoryDriver: 2630 tests, 3 classes unsuccessful, all three known (InMemUpsertAndExtractionTest, WireWriteSplittingTest fail without the change, HeapReadingFreshnessTest fills the heap). All contract suites (*Contract*, 20 tests) against a single node PoppyDB with the PooledDriver pass, WritePathAuditContractTest 5 of 5 (the six push cases of this entry pass); the PoppyDB CLI jar of that run was built before the review fix. Note: runtests.sh --poppydb rebuilds the PoppyDB CLI jar only when poppydb/src is newer than the jar, so a change in morphium-core needs a mvn package -pl poppydb -am first. Not covered: the index is not used by the planner for lookups per element (an index that holds an array is still left out of planning); parallel arrays in a compound index are taken as a product (mongod rejects them with 171).'
