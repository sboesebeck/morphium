- id: MOR-024
  title: 'Jakarta Data: support ordinal parameters (?1) in @Query'
  type: defect
  status: done
  priority: 2
  effort: S
  description: MorphiumDataProcessor rejects ordinal parameters, but the spec and TCK use them (SET length = length
