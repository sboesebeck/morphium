- id: MOR-010
  title: Typed duplicate-key exception and typed result for a lost conditional upsert
  type: implementation
  status: done
  priority: 2
  effort: M
  description: 'A conditional upsert on an existing but non-matching document throws MorphiumDriverException with
    mongoCode 11000 (Integer, writeErrors null); a store() duplicate reports the code inside writeErrors with mongoCode
    null. Add a typed exception or flag for duplicate key independent of the path, and a typed outcome (acquired
    / held) for the conditional upsert so callers need not parse getMongoCode(). Align with the exception model
    work in GitHub #210 and #211. MorphiumDriverException.isDuplicateKey() is added by MOR-006; this task adds the
    lastErrorObject to the findAndModify result (FindAndModifyMongoCommand.execute drops it today) and the typed
    outcome.'
  acceptance:
  - A single predicate/exception recognises duplicate key for both the findAndModify path and the writeErrors path,
    tested on a real MongoDB
  - The conditional upsert returns or throws a typed 'held' outcome that tests assert without inspecting codes
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-006
  source:
  - docs/research/reproduction-results.md hypothesis 5
  - docs/research/other-clients.md pattern 9
  - 'GitHub #210, #211'
  evidence: 'ModifyOutcomeTest 28 invocations (14 tests, one skipped on the InMemoryDriver), FindAndModifyLastErrorObjectTest
    10 and UpdateOutcomeTest 5, green on PooledDriver (mongo:8) and InMemoryDriver: lastErrorObject (updatedExisting,
    upserted, n) in the reply for update, inserting upsert with BEFORE and AFTER, and no match; INSERTED with BEFORE has
    no document but the upserted id; a lost conditional upsert is DUPLICATE_KEY without any code inspection and leaves
    the holder untouched; a duplicate key without upsert (unique index) and other failures are still thrown; a race of
    eight contenders yields exactly one INSERTED and seven DUPLICATE_KEY; findOneAndUpdate unchanged. The depends_on
    on MOR-008 was dropped: the typed outcome needs neither the options object nor the projection; arrayFilters came with MOR-006.
    Regression subset (72 classes plus the inmem package): 919 tests on the InMemoryDriver with the 2 known ReferenceCascadeTest errors (Byte
    Buddy does not support Java 25); on mongo:8 716 tests with the same ReferenceCascadeTest errors and the known flaky
    ExclusiveMessageTests x2; UpdateDocumentMapperKeyTest and WriterMarshallingDifferentialTest need both drivers in one
    run and pass with pooled,inmem. Known difference not addressed: the InMemoryDriver does not enforce the immutability
    of _id nor reject $inc on a string field. Not covered: PoppyDB, SingleMongoConnectDriver, replica sets.'
  commits:
  - ae5bba8ae
