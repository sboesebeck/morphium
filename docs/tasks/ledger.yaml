- id: MOR-041
  title: Key translation for operator maps in findOneAndUpdate
  type: implementation
  status: done
  priority: 2
  effort: M
  description: Translate the keys of operator maps in findOneAndUpdate to the Mongo field names for every operator,
    including the key of $unset and the key and target of $rename, dotted keys through a lenient resolveFieldPath
    and the single-segment resolver, never through @Aliases. The translation is always on, with a kill switch (translateUpdateFieldNames,
    default true) and a per-query override. Two keys that resolve to the same name throw only if their values differ.
    An update that would write a plaintext value into an @Encrypted field is rejected. The one-argument AnnotationAndReflectionHelper
    constructor gets a thread safe realClassCache.
  acceptance:
  - $set, $inc, $push and the other value operators with a Java-named key (translateCamelCase entity) are stored
    under the Mongo name, on a real MongoDB and on the InMemoryDriver, without a stray field
  - $unset of a Java name removes the real field and $rename translates key and target
  - A dotted key through a single embedded field uses the embedded class's own naming; positional, $-prefixed, unknown
    and @Aliases keys pass through verbatim
  - With translateUpdateFieldNames=false, or the per-query override false, keys are written verbatim as in the previous
    release
  - A collision of two keys with equal values is merged and with differing values rejected; an update of an @Encrypted
    field is rejected
  - Resolver names match serialize() for a corpus of entities and the resolver is idempotent
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-002
  source:
  - docs/research/plan-mor-001-002-003.md
  - docs/research/plan-mor-041.md
