- id: MOR-063
  title: 'quarkus-morphium migration lock: recognise a held lock by isDuplicateKey()'
  type: defect
  status: open
  priority: 2
  effort: S
  description: 'MorphiumMigrationRunner.acquireLock (quarkus-morphium/runtime) takes the lock with an upsert (Query.set(update, true, false)) and recognises a held lock only by e.getMessage().contains("duplicate key"). Since MOR-059 the write raises a MorphiumDriverException for the lost upsert; the message of the normaliser contains the server text, so the check still matches, but it is fragile, and a WriteConcernNotSatisfiedException (the lock IS written) is rethrown as a failure of the run while the lock stays held for its TTL. Use MorphiumDriverException.isDuplicateKey() and treat WriteConcernNotSatisfiedException as acquired (or release the lock). Released in lockstep with core 6.4.'
  acceptance:
  - A held lock is reported as "lock held" through isDuplicateKey(), tested against a real MongoDB with two runners
  - A write concern error while taking the lock does not leave a lock held by an aborted run
  source:
  - docs/research/plan-mor-059.md
- id: MOR-064
  title: 'store() of an existing entity swallows a rejected update (StoreMongoCommand)'
  type: defect
  status: done
  priority: 2
  effort: M
  description: 'Follow-up of MOR-059, not covered by it: StoreMongoCommand.execute() delegates to UpdateMongoCommand, and the store paths of MorphiumWriterImpl (store, storeList, the non-versioned update half) do not look at the writeErrors of the reply. A unique index violation on the store() of an existing entity is presumably silent (the versioned paths raise since MOR-059). Verify on a real MongoDB, then raise like the other paths (switch, async callbacks, FailedStore for storeList with continueOnError).'
  acceptance:
  - store() and storeList() of an existing entity raise a MorphiumDriverException (isDuplicateKey) for a unique index violation, on a real MongoDB; with continueOnError the FailedStore carries it
  source:
  - docs/research/plan-mor-059.md
  evidence: 'StoreRaisesOnRejectedUpdateTest (5 tests, 10 invocations, 1 skipped) on mongo:8 and the InMemoryDriver: store() of an existing entity raises the duplicate key and changes nothing, storeList raises and fires no postStore for the rejected entity, storeList(list, collection, true) reports exactly the rejected entity as a FailedStore (index in the original list, MorphiumDriverException with isDuplicateKey) and stores the entities before AND after it (unordered), a successful store still works, with WriterSettings.raiseOnWriteErrors off the rejection is ignored as before (real MongoDB). Regression: 1382 test methods (core and messaging tags) on the InMemoryDriver with only the known failures (LazyLoadingTest, ReferenceCascadeTest, ReferenceTest: Byte Buddy on Java 25; MultithreaddedMessagingTests: timing) plus WriteConcernErrorTest, whose provider was empty in an inmem-only run and now skips; 1263 invocations of the update, store, bulk, contract and reproduction classes on mongo:8 and the InMemoryDriver with the known failures only (ReferenceCascadeTest x2, CoreFunctionalityTests.cachedObjectOperationsTest, timing). The InMemoryDriver reports a rejected statement of an unordered update command in the reply (with its index) and goes on. Not covered: the async-callback store variants (the callback variant rethrows a RuntimeException as before), a write concern error during store.'
  commits:
  - 2209bb92e
- id: MOR-065
  title: 'Delete paths ignore the writeErrors of the delete reply'
  type: defect
  status: done
  priority: 3
  effort: S
  description: 'Follow-up of MOR-059: DeleteMongoCommand is the same hole as the update command; Query.remove and Morphium.delete do not look at the reply (the bulk context does since MOR-059). Verify which server errors a delete can report (a write concern error, a failing collation) and raise them like the update paths.'
  acceptance:
