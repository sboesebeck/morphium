  title: Morphium.simplifyQueryObject loses predicates for repeated operator keys
  type: defect
  status: done
  priority: 2
  effort: S
  description: Morphium.java simplifyQueryObject merges the operator maps of a query with putAll, so a repeated
    key such as $or or $and overwrites an earlier predicate and the query silently matches too much. The merge has
    to combine repeated keys instead of replacing them.
  acceptance:
