- id: MOR-099
  title: 'LeaseManager: a key other than the @Id, a fencing token, a generated _id, an acquisition time and renew'
  type: implementation
  status: done
  priority: 2
  effort: M
  description: 'The leases of a consuming application are keyed by a field with its own unique index (a lease name), have a generated UUID _id and count a fencing token with $inc on every grant; a renewal keeps the token and filters on it. LeaseManager keyed the lease by the @Id and had no token, so the application built these leases with the update builder by hand. The builder gets keyField (unique index required, checked), fencingField, acquiredAtField, idGenerator and assumeUniqueKey(); renew(key, owner, token, ttl) is a separate operation that filters on the token and never counts; LeaseResult gets getFencingToken() and the status LOST. The semantics follow what the application does: tryAcquire counts also for the holder acquiring again, renew never.'
  acceptance:
  - 'A lease keyed by another field is acquired, held, taken over and released; one document per key under eight contenders'
  - 'The fencing token grows with every grant, stays with a renewal, survives a release; a renewal with a stale token or another owner is LOST'
  - 'A key field without a declared unique index is refused unless assumeUniqueKey() is used'
  - 'LeaseManager.of(...) keeps working'
  source:
  - morphium-core/src/main/java/de/caluga/morphium/query/LeaseManager.java
  - morphium-core/src/main/java/de/caluga/morphium/query/LeaseResult.java
