- id: MOR-014
  title: 'Option E: startup guard for @Embedded under @Entity(translateCamelCase=false)'
  type: implementation
  status: done
  priority: 2
  effort: S
  description: 'Flag an @Embedded class with default translateCamelCase that is nested in an @Entity with translateCamelCase=false.
