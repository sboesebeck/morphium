  - The null result of an inserting upsert with BEFORE is documented in the Javadoc and covered by a test on a real
    MongoDB
  - ConditionalUpsertReproductionTest.upsertInsertWithReturnNewFalseReturnsNull still passes or is flipped deliberately
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-006
  source:
  - docs/research/reproduction-results.md hypothesis 5
  - docs/research/other-clients.md pattern 6
  evidence: 'ModifyOptionsTest 34 invocations (17 tests, 2 skipped on the InMemoryDriver: unknown hint rejected, collation)
    and FindAndModifyOptionsTest 5, green on PooledDriver (mongo:8, v8.3.x) and InMemoryDriver: upsert with BEFORE returns
