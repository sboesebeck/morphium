- id: MOR-001
  title: Decide the serialisation approach for update operator maps (options A to E)
  type: analysis
  status: done
  priority: 1
  effort: S
  description: 'Compare options A (mapper-aware update builder), B (marshal operator maps in findOneAndUpdate),
    C (POJO fallback hook in BsonEncoder), D (embedded inherits translateCamelCase) and E (startup guard) using
    the reproduced results. Expected outcome: B as immediate fix, A as target API, E as guard, D only as opt-in
    tri-state, C rejected or deferred (driver layer would depend on the mapper, InMemoryDriver would still differ).
    Record the decision as a short ADR-style note in docs/research/ and adjust the dependent tasks. Also consider
    that no other client makes embedded naming depend on the owner (other-clients.md pattern 15) and that Spring
    maps update documents idempotently (pattern 4).'
  acceptance:
  - A decision note in docs/research/ lists each option with the evidence from reproduction-results.md (hypotheses
    1, 2, 4) and a verdict (adopt / opt-in / reject)
  - Every verdict names the ledger task that implements it or states that none is planned
  source:
