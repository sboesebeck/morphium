- id: MOR-041
  title: Key translation for operator maps in findOneAndUpdate
  type: implementation
  status: done
  priority: 2
  effort: M
  description: Translate the keys of operator maps in findOneAndUpdate to the Mongo field names for every operator,
    including the key of $unset and the key and target of $rename, dotted keys through a lenient resolveFieldPath
    and the single-segment resolver, never through @Aliases. The translation is always on, with a kill switch (translateUpdateFieldNames,
    default true) and a per-query override. Two keys that resolve to the same name throw only if their values differ.
    An update that would write a plaintext value into an @Encrypted field is rejected. The one-argument AnnotationAndReflectionHelper
    constructor gets a thread safe realClassCache.
  acceptance:
  - $set, $inc, $push and the other value operators with a Java-named key (translateCamelCase entity) are stored
    under the Mongo name, on a real MongoDB and on the InMemoryDriver, without a stray field
  - $unset of a Java name removes the real field and $rename translates key and target
  - A dotted key through a single embedded field uses the embedded class's own naming; positional, $-prefixed, unknown
    and @Aliases keys pass through verbatim
  - With translateUpdateFieldNames=false, or the per-query override false, keys are written verbatim as in the previous
    release
  - A collision of two keys with equal values is merged and with differing values rejected; an update of an @Encrypted
    field is rejected
  - Resolver names match serialize() for a corpus of entities and the resolver is idempotent
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-002
  source:
  - docs/research/plan-mor-001-002-003.md
  - docs/research/plan-mor-041.md
  evidence: 'New tests: StoredFieldNameResolverTest 19, ResolveFieldPathTest 8, UpdateDocumentMapperKeyTest 12,
    UpdateKeyTranslationTest 48 invocations (1 skipped: cross-operator path conflict on InMem), MorphiumConfigTest
    16; all green on PooledDriver (mongo:8, v8.3.11) and InMemoryDriver. The raw-document reads of UpdateKeyTranslationTest
    bypass the projection to known fields that Query adds, so stray fields are really detected (the first run with
    asMapList was vacuous for strays). Regression subset of 38 classes: 672 tests on Mongo + InMem and 470 on InMem,
    0 failures, only ReferenceCascadeTest errors (Byte Buddy does not support Java 25, the JDK of the run; unrelated).
    Scope kept to the decisions in docs/research/plan-mor-041.md; Query.f is unchanged (MOR-043).'
  commits:
  - c0a2aede1
- id: MOR-042
  title: 'Writer path: marshal values with the shared update-value walk and use one convention for single values'
  type: implementation
  status: done
  priority: 3
  effort: L
  description: Query.set, push, pushAll, pull, pullAll, addToSet and addAllToSet marshal their values with the shared
    update-value walk, eagerly on the caller thread, in the element form, so Set, array, Map-in-Map and nested containers
    of @Embedded/@Entity values no longer fail on a real MongoDB or get stored as live objects by the InMemoryDriver.
    Output that works today stays identical (single embedded values keep class_name, a single entity keeps its _id);
    enum constants inside containers become name(), null list elements are kept and Enum map keys are accepted.
    The same PR changes findOneAndUpdate so that single values also carry class_name (one convention for update
    paths), fixes pullAll sending $pull, Query.set with a null value (NPE) and Query.set(Enum, ...) using toString(),
    and stops treating a Class value as an entity. Keys keep the strict getMongoFieldName semantics of the writer;
    currentDate (MOR-004), inc keys and swallowed write errors (MOR-005) are not part of this task. The marshalling
    covers Collection, not every Iterable.
  acceptance:
  - Query.set with a Set, an array, a Map-in-Map, nested lists and an enum list of @Embedded/Enum values stores
    the serialised value on a real MongoDB and on the InMemoryDriver
  - A differential test shows that the new writer function equals a verbatim copy of the previous one for every
    input whose output must not change
  - push, addToSet, pushAll, addAllToSet, pull and pullAll store documents with class_name for embedded elements,
    and pullAll with a list sends $pullAll, on a real MongoDB
  - Query.set(field, null, ...) and Query.set(Enum, ...) work and use the constant name
  - An invalid value throws an IllegalArgumentException directly from the call, fires no store event, and a collection
    mutated after the call does not change the write
  - findOneAndUpdate of a single embedded value carries class_name
  - The MorphiumMigrationRunner shaped upsert (Map.of(String, Date) with a @Property entity) behaves as before on
    a real MongoDB
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-002
  source:
  - docs/research/plan-mor-001-002-003.md
  - docs/research/plan-mor-042.md
  evidence: 'New: WriterMarshallingDifferentialTest 4 (KEEP rows equal a verbatim copy of the previous function,
    SWITCH rows asserted), WriterPathWiringTest 34 (1 skipped), WriterPathMarshallingTest 30, the repro pins of
    PojoInSetOperatorReproductionTest flipped (6); all green on PooledDriver (mongo:8) and InMemoryDriver. With
    the writer, Query and MorphiumBase changes reverted, 25 of the 34 new tests of the last two classes fail, so
