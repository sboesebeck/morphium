- id: MOR-025
  title: 'Jakarta Data: @Update is not atomic and throws IllegalStateException'
  type: defect
  status: done
  priority: 2
  effort: M
  description: '@Update does findById then store(): an extra round trip, not atomic, and a missing entity or version
    mismatch raises IllegalStateException instead of jakarta.data.exceptions.OptimisticLockingFailureException (AbstractMorphiumRepository
    ~line 324). Align the exception type with the spec and use a versioned filter update if the entity has @Version.'
  acceptance:
  - A stale-version @Update throws OptimisticLockingFailureException, tested on a real MongoDB
  - A missing entity behaves as the spec describes, tested
  - Verified against a real MongoDB (not only the InMemoryDriver).
  source:
  - docs/research/jakarta-data-1.1.md sections 3, 4
  evidence: 'AbstractMorphiumRepositoryOptimisticLockingTest (5 tests, 10 invocations) on the InMemoryDriver and on mongo:8 with the pooled driver (MORPHIUM_TEST_MONGO): a versioned entity is updated and its version grows, a stale version is an OptimisticLockingFailureException that changes nothing, a versioned entity that was deleted is one too and is not created again, an unversioned missing entity is one and is not created, updateAll rejects a batch with a missing unversioned entity before it stores any and raises the same exception for a stale version. Against the old code 8 of the 10 fail. AbstractMorphiumRepositoryUpdateTest now expects the new exception; the whole jakarta-data module (92) passes with the mongo:8 variant, and the Quarkus runtime (82), deployment (31) and integration suites (264) pass (one run had two timing failures in MorphiumMigrationTest, which passed alone and in the repeated full run). Fix in AbstractMorphiumRepository: a versioned entity goes to the versioned store() alone and its VersionMismatchException becomes the Jakarta exception, so the extra findById is gone for it; an unversioned entity is still looked up first, which stays non-atomic (documented in docs/jakarta-data.md and the Javadoc). Not covered: updateAll with a stale version leaves the entities stored before it updated, a replica set, the async repository variants.'
  commits:
  - 998dda853
- id: MOR-026
  title: Run the Jakarta Data TCK against morphium-jakarta-data
  type: infrastructure
  status: done
  priority: 2
  effort: M
  description: No jakarta.data-tck dependency exists in any pom. Micronaut Data has a jakarta-data-tck/mongodb module
    as a model. Add the TCK matching the implemented API version and run it against a real MongoDB and PoppyDB/InMemoryDriver.
  acceptance:
  - A documented command runs the TCK; the list of excluded tests has a reason per entry
  - The TCK runs in CI or a task for CI is added to this ledger
  - Verified against a real MongoDB (not only the InMemoryDriver).
  source:
  - docs/research/other-clients.md pattern 14
  notes: 'Spike on 2026-10-21 (branch test/mor-026-jakarta-data-tck, JakartaDataTckSpikeTest in the Spring module). jakarta.data-tck 1.0.0 (164 KB, from Maven Central) is built for a Jakarta EE container with Arquillian; its standalone tests cannot run as they are. What works: a harness that loads the TCK classes through its own class loader, adds the Morphium @Entity and @Id to the entities (ByteBuddy, because they carry only jakarta.persistence and jakarta.nosql annotations), builds the repositories with the Spring proxy and calls the 73 @Assertion methods of EntityTests by reflection. State: 0 of 73 pass. Found and fixed on the way: the Spring factory resolved entity and id only for CrudRepository (commit 1a5ef1ca5). Blocking all 73 (their @BeforeEach calls it): NaturalNumbers.countAll(), a derived query without By, is unsupported (MOR-076). Not supported by design: MultipleEntityRepo and CustomRepository have no single primary entity (MOR-077). Not yet looked at: the other 70 or so assertions once the populate step works, the CDI tests, the signature test and the web tests (need a container), and the Quarkus build, which needs the TCK repositories in the Jandex index. Acceptance not met: no documented command, no exclusion list, no CI task.'
  notes_2026_10_21_after_MOR_076: 'With countAll (MOR-076) 22 of 73 pass on the InMemoryDriver. The 51 failures, by cause: 18 entity mapping (could not set field: the TCK entities have fields that the mapper does not set, to be looked at); 6 CursoredPage (the bridge returns a MorphiumPage that is not a CursoredPage for derived queries with a PageRequest of the cursor kind); 4 derived names that the parser does not know (findFirst3By... And ...EndsWith, findFirstBy...StartsWith...); about 12 wrong results (order or contents: Sort/Order parameters mixed with OrderBy, IN, NOT, literals in @Query: a string literal with a quote, :type AND id < :xmax read as one parameter name); 2 internal driver errors; 3 NullPointerException because MultipleEntityRepo and CustomRepository have no repository (MOR-077); 2 field not found (hexadecimal, sorts) in @Query/@OrderBy handling. Each of these is a separate small task; none is filed yet except MOR-077.'
  evidence: 'JakartaDataTckTest (Spring module, replaces the spike) runs the 73 standalone assertions of jakarta.data-tck 1.0.0 without Arquillian and fails when a test that is not excluded fails or an excluded test passes. all 73 pass on the InMemoryDriver and on a real mongo:8 (PooledDriver, port 27099), with morphium.enum-type=ORDINAL (MOR-093) for the four tests that sort an enum by its ordinal; there are no exclusions. The test is part of the normal test run of the Spring module, so CI runs it wherever that module is built. Documented in docs/jakarta-data.md (Conformance). Fixed on the way, one task per cause: MOR-076, 078 to 091.'
  commits:
  - 1a5ef1ca5
- id: MOR-076
  title: 'Jakarta Data: derived queries without By (countAll and similar) are unsupported'
  type: defect
  status: done
  priority: 2
  effort: S
  description: 'Found by the TCK spike of MOR-026. The Jakarta Data TCK repository NaturalNumbers declares long countAll() without an annotation, and its tests call it in @BeforeEach, so every standalone TCK test fails on it. MethodNameParser only knows find/count/exists/delete followed by By; the Quarkus processor and the Spring handler throw "Unsupported repository method" for countAll. Check which no-By forms the specification names (countAll, findAll, existsAll, deleteAll) and support them in both modules.'
  acceptance:
  - countAll() and the other no-By forms the specification names work in the Quarkus and the Spring module
  source:
  - morphium-jakarta-data/src/main/java/de/caluga/morphium/data/MethodNameParser.java
  evidence: 'The TCK repositories were searched for derived names without By: countAll() is the only one that is not annotated (findAll and deleteAll are CRUD names, the others carry @Query or @Find). MethodNameParser.parse("countAll") is a count without conditions (MethodNameParserTest, red without the change); the Quarkus processor and the Spring handler route countAll to the derived-query generation. Quarkus: OrderRepository.countAll() counts all documents on the InMemoryDriver and on a real mongo:8 (AbstractMorphiumDataOrdinalQueryTest, 5 tests each); Spring: countAllHasNoByAndCountsEveryDocument. Suites: jakarta-data 129, Quarkus runtime 83, deployment 43, integration 294 (one failure, MorphiumMigrationTest.renewLockBetweenChangeUnitsAdvancesExpiry, which fails the same without this change on a busy machine, see MOR-074), Spring 41. Only countAll is supported, not existsAll or other invented forms.'
  commits:
