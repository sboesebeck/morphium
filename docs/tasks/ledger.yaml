- id: MOR-002
  title: 'Option B: marshal every operator map in Query.findOneAndUpdate'
  type: defect
  status: done
  priority: 1
  effort: M
  description: 'Query.findOneAndUpdate(Map, upsert, returnNew) hands the raw map to FindAndModifyMongoCommand; an
    @Embedded POJO in a List, Set, array, single value, Map or Map-in-Map fails client-side with ''Unhandled Data
    type'' (hypothesis 1 confirmed). Marshal the values of every operator map ($set, $setOnInsert, $inc, $addToSet,
    $push, ...) through the mapper and translate field names. Make MorphiumWriterImpl.marshallIfNecessary handle
    any Iterable, array and nested Map; this also fixes Query.set with a Set, an array or a Map-in-Map (same hole,
    reproduced). Expose ObjectMapperImpl.marshallIfNecessary on MorphiumObjectMapper if that is the clean way. Marshalling
    must be idempotent for already serialised documents (Spring UpdateMapper pattern); watch class_name on non-polymorphic
    embeddeds. Scope of this task is values only (PR 1 of 3): key translation is MOR-041 and the writer path is
    MOR-042. The new mapper method is abstract on the interface, @Reference targets are not serialised inline, and
    the fieldNameCache inner map is made thread safe (MOR-040).'
  acceptance:
  - PojoInSetOperatorReproductionTest assertions are flipped to the positive expectation for List, Set, array, single
    value, Map and Map-in-Map on a real MongoDB and on the InMemoryDriver
  - A test passes the output of mapper.serialize() through the new path and the stored document is unchanged (double
    marshalling is stable)
  - No class_name is added to non-polymorphic embedded elements beyond the existing serializeIterable behaviour,
    documented by a test
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-001
  source:
  - docs/research/reproduction-results.md hypothesis 1
  - docs/research/reproduction-results.md (serialisation analysis)
  evidence: 'PojoInSetOperatorReproductionTest.rawPojoShapesInSet flipped (6 shapes, both drivers); UpdateValueMarshallingTest
    28 invocations on PooledDriver (mongo:8, v8.3.11) and InMemoryDriver, 0 failures, 1 skipped (replacement document
    on InMem, GitHub #399); regression subset of 32 classes: 523 tests on Mongo + InMem and 353 on InMem, only ReferenceCascadeTest
    fails (Byte Buddy does not support Java 25, the JDK used for the run; unrelated). Acceptance ''Query.set with
    a Set'' moved to MOR-042.'
  commits:
  - c884c64a4
- id: MOR-003
  title: findOneAndUpdate with a compound filter and upsert collides on _id (code 66)
  type: defect
  status: done
  priority: 1
  effort: S
  description: addGeneratedIdOnInsertIfNeeded only looks for _id at the top level of the filter. A compound filter
    (_id = X AND (a OR b)) is wrapped in $and, so a generated _id is added via $setOnInsert and MongoDB rejects
    the first insert with code 66 ('would modify the immutable field _id'). The InMemoryDriver silently stores the
    document under the generated id and inserts another document on every call. Found by the reproduction. A probe
    on a real MongoDB showed that the server seeds _id from an equality on _id reachable through $and and single-branch
    $or, from a one-element $in, and from a dotted _id.x key.
  acceptance:
  - An upsert whose filter contains an equality on _id reachable through $and or a single-branch $or, a one-element
    $in, or a dotted _id.x key inserts the document with the _id from the filter, on a real MongoDB
  - Filters that the server does not seed from (multi-valued $in, multi-branch $or, range operators, regex, $nor)
    still receive the generated _id and insert without error
  - ConditionalUpsertReproductionTest.conditionalUpsertViaQueryGeneratesConflictingId is flipped accordingly
  source:
  - docs/research/reproduction-results.md hypothesis 5
  - docs/research/upsert-id-seeding-probe.md
  evidence: 'UpsertFilterInspectorTest 10 tests; ConditionalUpsertReproductionTest.conditionalUpsertViaQueryKeepsFilterId
    and FindOneAndUpdateCompoundFilterUpsertTest (first acquire inserts under the filter id, held lease gives E11000
    on a real MongoDB, 8 contenders: exactly one winner) green on mongo:8 and InMem. Rule derived from the server
    probe docs/research/upsert-id-seeding-probe.md; multi-branch $or stays out of scope because the server does
    not seed there.'
  commits:
  - c884c64a4
  - 2ab9da751
- id: MOR-004
  title: 'MorphiumBase.currentDate sends $set: {$currentDate: ...} and fails silently'
  type: defect
  status: done
  priority: 1
  effort: S
  description: 'currentDate(query, field, upsert, multiple) delegates to set(...), so the wire command is {"$set":{"$currentDate":{"lastSeen":1}}}.
    MongoDB answers with code 52 in writeErrors (n=0) and NO exception is thrown; the field is unchanged. The InMemoryDriver
    reports n=1, nModified=1 and changes nothing. Send a real $currentDate operator (raw $currentDate through findOneAndUpdate
    and the bulk addCurrentDateRequest already work). Both enum and String overloads. Related: the silent writeErrors
    are covered by MOR-005.'
  acceptance:
  - currentDate by field name and by enum updates the field on a real MongoDB and on the InMemoryDriver, with and
    without upsert
  - The InMemoryDriver rejects a $currentDate nested under $set like MongoDB does (no false n=1)
  - CurrentDateReproductionTest assertions are flipped to the positive expectation
  - Verified against a real MongoDB (not only the InMemoryDriver).
  source:
  - docs/research/reproduction-results.md hypothesis 3
  evidence: 'CurrentDateReproductionTest flipped and extended (12 invocations: field name, enum, upsert that inserts,
    operator mixed with a plain field, operator only, $-prefixed field under $set), green on PooledDriver (mongo:8)
    and InMemoryDriver. Cause was twofold: the operator was nested under $set, and the value was the int 1, which
    MongoDB rejects for $currentDate; both fixed. The InMemoryDriver now rejects a $-prefixed field name under $set
    with code 52 (it still counts the matched document in n, MongoDB reports n=0). Regression: inmem package suite
    and the writer/mapper subset, 769 tests on the InMemoryDriver, 0 failures and 2 ReferenceCascadeTest errors
    (Byte Buddy does not support Java 25, the JDK of the run; unrelated); WriterPathWiringTest, WriterPathMarshallingTest
    and WriterMarshallingDifferentialTest green on a real MongoDB.'
  commits:
  - a4885dcfc
- id: MOR-005
  title: Audit Query.set/inc/push write paths for swallowed writeErrors and missing name translation
  type: verification
  status: done
  priority: 2
  effort: S
  description: 'The currentDate reproduction shows that a writeErrors entry (code 52) does not raise an exception
    on the Query.set path. Check which update paths (set, inc, dec, push, pull, addToSet, unset, bulk) ignore writeErrors,
    and fix or file the confirmed ones. Also verify the unconfirmed claim that MorphiumWriter.inc(Query, Map) puts
    keys into $inc without field-name translation (MorphiumWriterImpl ~line 2025). Do not duplicate GitHub #408
    (writeConcernError ignored); link it. Finding from MOR-042: MorphiumWriterImpl.inc(Query, Map) puts the keys
    of the map into $inc without name translation (around line 2025), unlike the single-field inc; verify with a
    test on a real MongoDB.'
  acceptance:
  - 'A table in docs/research/ lists each update path with: raises on writeErrors yes/no, translates field names
    yes/no, proven by a test on a real MongoDB'
  - Every 'no' has a fix task in the ledger or a fix in the same change
  source:
  - docs/research/reproduction-results.md hypothesis 3
  - docs/research/jakarta-data-1.1.md section 4
  - 'GitHub #408'
  evidence: 'WritePathAuditContractTest (4 tests, 7 invocations) and docs/research/audit-write-paths.md: 37 write paths
    of Query, Morphium and the bulk context measured on mongo:8 (v8.3.x, PooledDriver) for raising on a rejected write and
    for name translation, translation also on the InMemoryDriver. Result: only Morphium.inc(entity) and dec(entity) raise,
    every other path swallows the writeErrors (MOR-059, priority 1; GitHub #408 is the same family); Morphium.inc(Query, Map),
    inc(Map<Enum,Number>, Query) and dec(Query, Map) write the Java name, confirming the MOR-042 finding, and dotted paths
    through an embedded document are translated only in the first segment by Query.set, Query.inc and currentDate (MOR-060);
    dec with a Map increments (MOR-062); Query.dec(field, Integer) stores a double (MOR-061). Every no has a ledger task; the
    current behaviour is pinned in the test with the task id and UpdateContractLedgerTest fails when such a task is done.
    Not covered: writeConcernError (GitHub #408), the async callback variants (same implementation), the Morphium.set/store
    paths of whole entities, replica sets.'
  commits:
  - 0e83869cb
- id: MOR-006
  title: 'Option A core: mapper-aware update builder (set, setOnInsert, inc, unset) with findOneAndUpdate terminal'
  type: implementation
  status: done
  priority: 1
  effort: L
  description: 'Query.modify() returns an UpdateBuilder with set, setOnInsert, inc, unset and upsert and the terminal
    findOneAndUpdate(ReturnDocument). Each call is mapped immediately through the UpdateDocumentMapper (keys always
    translated with resolveFieldPath, values in the element form, @Reference and @Encrypted guards), merged per
    operator and checked for path conflicts. The terminal injects the @Version field (inc when the update modifies,
    setOnInsert when it only creates; an explicit touch wins; honours isAutoValuesEnabled), rejects an empty builder,
    setOnInsert without upsert, skip, limit, hint and projection, and runs the existing findOneAndUpdateMapped.
    Also in this task: arrayFilters support in FindAndModifyMongoCommand and InMemoryDriver.findAndOneAndUpdate,
    MorphiumDriverException.isDuplicateKey(), and an Instant spike for update documents on the InMemoryDriver. @LastChange
    and @CreationTime are not applied (MOR-009); updateOne, updateMany and UpdateResult are MOR-050.'
  acceptance:
  - 'A lease acquisition (conditional upsert) with Java field names, an Instant field and an @Version Long field
    works on a real MongoDB and on the InMemoryDriver: first acquire inserts under the filter _id, a held lease
    raises an exception for which isDuplicateKey() is true and leaves the document untouched, 8 racing threads have
    exactly one winner'
  - A counter with inc and upsert creates on insert and adds on update, 8 x 50 concurrent increments give 400
  - Create-if-absent with setOnInsert never overwrites an existing document and does not bump its version
  - A store() after a builder upsert does not hit a duplicate key, and a store() with a stale version after a builder
    update is rejected
  - Embedded lists, sets, single values, maps, enums and Instant values need no manual conversion
  - An empty builder, setOnInsert without upsert, conflicting paths, skip, limit, hint and projection are rejected
    before any command is sent and the document stays intact
  - arrayFilters work with findOneAndUpdate on both drivers
  - Verified against a real MongoDB (not only the InMemoryDriver).
  depends_on:
  - MOR-001
  - MOR-002
  source:
  - docs/research/plan-mor-001-002-003.md
  - docs/research/plan-mor-006.md
  evidence: 'New: JavaTimeInUpdateDocumentTest 6 (the spike: an Instant in an update document was not readable on
    the InMemoryDriver, fixed by routing the java.time types through their mappers, shapes equal store() on both
    drivers), FindOneAndUpdateArrayFiltersAndSortTest 8 (6 failed before the arrayFilters wiring), UpdateOperationsTest
    16, MorphiumDriverExceptionDuplicateKeyTest 4, ModifyLeaseAndCounterTest 32, ModifyValuesAndKeysTest 26, ModifyValidationTest
    34; all green on PooledDriver (mongo:8, v8.3.11) and InMemoryDriver. Lease: first acquire under the filter _id,
    held lease isDuplicateKey on both drivers with the document untouched, 8 racing threads on a fresh and on an
    expired lease have exactly one winner, store() after a builder upsert works and a stale store() is rejected.
    Mutation check: with the version injection disabled 10 of the new tests fail. Regression subset (63 classes):
    851 tests on the InMemoryDriver with 2 errors (ReferenceCascadeTest, Byte Buddy does not support Java 25, the
    JDK of the run); on a real MongoDB plus InMem 992 tests with ReferenceCascadeTest (4), ExclusiveMessageTests.exclusiveTest/exclusivityTest
    (fail identically on the commit before PR 3, see MOR-042), CoreFunctionalityTests.cachedObjectOperationsTest
    (timing, passes when repeated, see MOR-042) and WriterPathWiringTest.currentDateStillDoesNotSetTheField, which
    pinned the MOR-004 defect and was turned into the positive expectation. Not covered: updateOne/updateMany (MOR-050),
    @LastChange/@CreationTime (MOR-009), PoppyDB, SingleMongoConnectDriver, replica sets, the Quarkus and Spring
    modules.'
  commits:
  - c84172c12
  - 3549acf79
  - 4e889b715
  - 792cc3924
