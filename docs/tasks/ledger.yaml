  - The existing JdqlParserTest cases still pass
  source:
  - morphium-jakarta-data/src/main/java/de/caluga/morphium/data/JdqlOperands.java
  - morphium-jakarta-data/src/main/java/de/caluga/morphium/data/JdqlParser.java
