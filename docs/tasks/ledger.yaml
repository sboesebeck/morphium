- id: MOR-077
  title: 'Jakarta Data: repositories without a single primary entity are unsupported'
  type: verification
  status: done
  priority: 2
  effort: M
  description: 'Found by the TCK spike of MOR-026. RepositoryMetadata holds one entity class per repository. The TCK repositories MultipleEntityRepo (lifecycle methods for Box and Coordinate, no BasicRepository) and CustomRepository (no generic parameters) have no primary entity, and the Spring factory refuses them. The specification allows such repositories (the primary entity is determined from the lifecycle methods). Decide: support them, or list them as excluded in MOR-026 with this reason.'
