- id: MOR-060
  title: 'Write paths that write the Java field name: inc/dec with a Map and dotted paths through embedded documents'
  type: defect
  status: done
  priority: 2
  effort: S
  description: 'Found by the write path audit (MOR-005), measured on mongo:8 and on the InMemoryDriver.
    Morphium.inc(Query, Map), inc(Map<Enum,Number>, Query) and dec(Query, Map) put the keys of the map into $inc
    without translation (MorphiumWriterImpl.inc(Query, Map) copies the map), so counterValue is written next to the
    stored counter_value. Query.set, Query.inc and Morphium.currentDate with a dotted path through an @Embedded document
    (box.innerValue) translate the first segment but write the second as given, next to the stored box.inner_value;
    the update builder (resolveFieldPath) translates the same path correctly.'
  acceptance:
  - The three Map variants and the dotted paths of Query.set, Query.inc and currentDate write the stored name, on
    both drivers
  - The pinned deviation MOR-060 in WritePathAuditContractTest is removed
  source:
  - docs/research/audit-write-paths.md
  evidence: 'WritePathAuditContractTest (translation probes, 37 paths) green on PooledDriver (mongo:8, v8.3.x) and InMemoryDriver with no pinned deviation left: inc(Query, Map), inc(Map<Enum,Number>, Query), dec(Query, Map) and the dotted paths through an embedded document of Query.set, Query.inc and Morphium.currentDate write the stored name. Regression (1166 invocations on both drivers) shows only the known failures (ReferenceCascadeTest, ExclusiveMessageTests x2, TransactionTest needs a replica set).'
  commits:
  - fa03a4142
- id: MOR-061
  title: 'Query.dec(field, Integer) turns an int counter into a double'
  type: defect
  status: done
  priority: 3
  effort: S
  description: 'Found by the write path audit (MOR-005). Query.dec(String, Integer) resolves to the Number overload of
    Morphium.dec, which subtracts amount.doubleValue(), so a decrement of an int or long field stores a double (5 becomes
    5.0). dec(field, int) and dec(field, long) keep the type; inc has no such asymmetry.'
  acceptance:
  - dec with an Integer or Long amount keeps the number type of the field, on a real MongoDB
  source:
  - docs/research/audit-write-paths.md
  evidence: 'decKeepsTheNumberTypeOfTheAmount on mongo:8 and the InMemoryDriver: dec with an Integer amount keeps an int field an int, a Long amount makes it a long as inc does, a Double amount a double; the Number overloads of Query, Morphium and the entity variants negate in the type of the amount.'
  commits:
  - fa03a4142
